# nginx vhost on the **api VM** for tools.actianlabs.com.
#
# tools.actianlabs.com hosts small standalone tools, one per path prefix.
# Four tenants live here today:
#
#   /schema/api/*     → localhost:8089 (schema-drift-advisor, /schema stripped)
#   /schema/*         → SPA static files + index.html fallback
#   /dpcompare/api/*  → localhost:8090 (data product compare, /dpcompare stripped)
#   /dpcompare/*      → SPA static files + index.html fallback
#   /crm/api/*        → localhost:8091 (crm-svc, /crm stripped)
#   /crm/mcp          → localhost:8092 (crm-mcp, Streamable HTTP)
#   /crm/*            → SPA static files + index.html fallback
#   /contextbuilder/api/* → localhost:8093 (contextbuilder, /contextbuilder stripped)
#   /contextbuilder/* → SPA static files + index.html fallback
#   /                 → minimal landing page listing the tools (jgperrin/ai.jgp.tools)
#
# The data-product-compare backend also talks to an embedding-similarity
# sidecar on 127.0.0.1:8100. That one is internal — nginx must NOT expose it.
#
# The CRM deliberately gets NO card on the landing page (JGP's decision,
# ops#368): it is invitation-only and holds contact PII.
#
# Listens on plain HTTP, port 80, internal IP only. TLS termination
# happens on cahya, which proxies to here over the internal network
# (see ops/infra/cahya/nginx/sites-available/tools.actianlabs.com.conf).
# Cahya is NOT pure pass-through for the CRM: its own client_max_body_size
# and proxy_read_timeout front these locations and the smaller of any layer
# wins, so the 64 MB queue upload and the long-lived MCP stream needed edits
# there too. Change both files together.
#
# This file is kept byte-identical in three places — the ops repo
# (infra/api-vm/nginx/sites-available/), jgperrin/ai.jgp.crm (deploy/nginx/)
# and jgperrin/ai.jgp.tools.similardataproduct (deploy/nginx/). Change all
# three. (The copy in ai.jgp.tools.schemadriftadvisor/deploy/nginx/ predates
# the dpcompare tenant and is stale — it is not authoritative.)
#
# Install on the api VM:
#   sudo cp tools.actianlabs.com.api.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/tools.actianlabs.com.api.conf \
#              /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/tools.actianlabs.com/schema \
#                 /var/www/tools.actianlabs.com/dpcompare \
#                 /var/www/tools.actianlabs.com/crm
#   sudo chown -R www-data:www-data /var/www/tools.actianlabs.com
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name tools.actianlabs.com;

    root /var/www/tools.actianlabs.com;
    index index.html;

    # Contracts arrive as multipart on /schema/api/v1/compare; Spring caps
    # the request at 5 MB (max-request-size). nginx must match or the
    # upload 413s here before reaching the app. Cahya's gateway must also
    # allow at least this much — the smaller of any layer wins. This
    # server-level value is the default; /dpcompare/api/ raises its own.
    client_max_body_size 5M;

    # /schema/api/* → schema-drift-advisor backend on this same VM, with
    # the /schema prefix stripped (the app serves /api/* natively).
    location /schema/api/ {
        proxy_pass http://127.0.0.1:8089/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite-hashed assets — cache forever (filenames change on rebuild).
    location /schema/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for the Schema Drift Advisor.
    location /schema/ {
        try_files $uri $uri/ /schema/index.html;
    }

    # /dpcompare/api/* → data product compare backend on this same VM, with
    # the /dpcompare prefix stripped (the app serves /api/* natively).
    location /dpcompare/api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads here are ZIP *bundles* (one ODPS + its ODCS contracts), two
        # at a time on /compare/products, and the batch sweep takes an archive
        # of up to 500 products. Real bundles are a few KB; 25M is headroom
        # well under the app's own 200 MB uncompressed zip-bomb guard.
        client_max_body_size 25M;

        # The decision tree walks recursively and may call the sidecar and the
        # Schema Drift Advisor per gate; the default 60s read timeout is thin
        # for a cold-model first request.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite-hashed assets — cache forever (filenames change on rebuild).
    location /dpcompare/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for Data Product Compare.
    location /dpcompare/ {
        try_files $uri $uri/ /dpcompare/index.html;
    }

    # -----------------------------------------------------------------------
    # CRM (ops#368, epic CRM#1) — crm-svc :8091, crm-mcp :8092
    # -----------------------------------------------------------------------

    # /crm → /crm/. A RELATIVE redirect on purpose: nginx here only ever sees
    # plain HTTP from cahya, so an absolute redirect sends the browser to
    # http:// and costs a downgrade plus an extra hop back up to https. That is
    # exactly what /schema does today (301 → http://tools.actianlabs.com/schema/)
    # and it is a wart, not a pattern to copy.
    #
    # `absolute_redirect off` is what actually makes it relative: nginx
    # defaults it to ON and rebuilds a bare `return 301 /crm/` into
    # $scheme://$host/crm/, which is how the http:// leaks back in. Verified —
    # without this line the redirect really does go to http.
    location = /crm {
        absolute_redirect off;
        return 301 /crm/;
    }

    # Actuator is NOT under the app's /api/v1 prefix: ApiPathPrefixConfig
    # prefixes only @RestController beans in ai.jgp.crm.svc.web, and actuator
    # endpoints are not those. So /crm/api/actuator/* needs its own location —
    # the /crm/api/ rule below would proxy it to :8091/api/actuator/, which
    # does not exist. nginx picks the LONGEST matching prefix, so this wins
    # over /crm/api/ regardless of the order the two appear in.
    #
    # Only health and info are exposed at all
    # (management.endpoints.web.exposure.include=health,info) and only
    # /actuator/health is permitAll — /actuator/info still needs a token.
    # This is the URL the deploy smoke gate probes.
    location /crm/api/actuator/ {
        proxy_pass http://127.0.0.1:8091/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /crm/api/* → crm-svc on this same VM, with the /crm prefix stripped
    # (the app serves /api/v1/* natively — server.servlet.context-path stays /).
    location /crm/api/ {
        proxy_pass http://127.0.0.1:8091/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Queue uploads are screenshots, call recordings and video transcripts.
        # The app caps both per-file and per-request at 64 MB
        # (spring.servlet.multipart.max-file-size / max-request-size) and turns
        # its own refusal into a clean 413. nginx has to allow at least that
        # much or it 413s first, from here, before Spring ever sees the request
        # — same class of bug as the /schema 5M ceiling. Cahya must allow it
        # too; the smaller of any layer wins.
        client_max_body_size 64m;

        # A 64 MB upload over a hotel wifi outlives the default 60s. This is a
        # ceiling, not a delay — it costs a fast request nothing.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # RFC 9728 protected-resource metadata at the CRM root. An MCP client
    # fetches this BEFORE it has a token, to discover the authorization
    # server, so it must stay reachable unauthenticated (permitAll in
    # McpSecurityConfig). crm-mcp serves it at both /.well-known/... and
    # /mcp/.well-known/...; this routes the root form, and the /crm/mcp
    # location below already covers the prefixed one.
    location /crm/.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:8092/.well-known/oauth-protected-resource;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # crm-mcp's own actuator. Longer prefix than /crm/mcp, so it wins.
    #
    # This is the ONLY public place the deployed version can be read. crm-svc's
    # /actuator/info requires a token by deliberate design (SecurityConfig:
    # permitAll is health and nothing else), and `initialize` on /crm/mcp is
    # authenticated too — so the deploy smoke gate has no other way to prove
    # that the commit it just shipped is the commit now running. crm-mcp's
    # health and info are permitAll in McpSecurityConfig precisely because
    # uptime checks read them; this exposes those two and nothing else
    # (management.endpoints.web.exposure.include=health,info).
    location /crm/mcp/actuator/ {
        proxy_pass http://127.0.0.1:8092/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /crm/mcp → crm-mcp. No trailing slash on either side, so /crm/mcp maps to
    # /mcp and /crm/mcp/… to /mcp/… (which is how the prefixed .well-known form
    # is served).
    #
    # Streamable HTTP holds the response open for the life of a tool call, so:
    #   proxy_buffering off  — with buffering on, nginx accumulates the stream
    #                          and the client sees nothing until it completes,
    #                          which defeats the transport.
    #   Connection ""        — clears the hop-by-hop close nginx would send.
    #   long read timeout    — the default 60s would cut a slow tool mid-call,
    #                          and a triage call does real work.
    location /crm/mcp {
        proxy_pass http://127.0.0.1:8092/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Vite-hashed assets — cache forever (filenames change on rebuild).
    location /crm/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for the CRM reporting UI. `base: '/crm/'` in vite.config.js
    # is what makes this and the asset rule above line up.
    location /crm/ {
        try_files $uri $uri/ /crm/index.html;
    }

    # -----------------------------------------------------------------------
    # Context Builder (jgperrin/ai.jgp.hackathon.snowflake) — :8093
    # -----------------------------------------------------------------------

    # /contextbuilder → /contextbuilder/. A RELATIVE redirect, same reasoning as
    # /crm: nginx here only ever sees plain HTTP from cahya, so an absolute
    # redirect sends the browser to http:// and costs a downgrade plus an extra
    # hop back up. `absolute_redirect off` is what makes it relative — without
    # it nginx rebuilds the bare `return 301` into $scheme://$host/contextbuilder/.
    location = /contextbuilder {
        absolute_redirect off;
        return 301 /contextbuilder/;
    }

    # /contextbuilder/api/* → contextbuilder on this VM, with the
    # /contextbuilder prefix stripped (the app serves /api/* natively —
    # server.servlet.context-path stays /).
    location /contextbuilder/api/ {
        proxy_pass http://127.0.0.1:8093/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Profiling a wide table and a Cortex round trip both run long; the
        # 60s default would cut them off mid-request.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite-hashed assets — cache forever (filenames change on rebuild).
    location /contextbuilder/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for Context Builder. `base: '/contextbuilder/'` in
    # vite.config.ts is what makes this and the asset rule above line up.
    location /contextbuilder/ {
        try_files $uri $uri/ /contextbuilder/index.html;
    }

    # Landing page listing the tools (static, from jgperrin/ai.jgp.tools).
    location / {
        try_files $uri $uri/ =404;
    }
}
