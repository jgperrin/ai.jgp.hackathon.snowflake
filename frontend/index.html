<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Relative, so it resolves under the /contextbuilder subpath without relying on Vite rewriting it. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Context Builder</title>
    <script>
      // Appearance before first paint (DIND#59), so nobody sees a frame in the wrong theme. Mirrors
      // applyAppearance in src/lib/appearance.ts; 'cb-appearance' is APPEARANCE_KEY there.
      try {
        var mode = localStorage.getItem('cb-appearance')
        if (mode === 'light' || mode === 'dark') {
          document.documentElement.dataset.theme = mode
          document.documentElement.style.colorScheme = mode
        }
      } catch (e) {
        // Storage blocked: stay on System, which the CSS media query handles.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
