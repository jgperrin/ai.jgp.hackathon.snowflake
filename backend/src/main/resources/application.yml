spring:
  application:
    name: ai-jgp-hackathon-snowflake
  config:
    # Local credentials live in backend/.env (gitignored), KEY=value per line.
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      # Help panel attachments: 10 MB a file, 25 MB a report, plus room for the text parts.
      max-file-size: 10MB
      max-request-size: 26MB

server:
  port: 8080

# Credentials are read from the environment and are never committed.
# Run with -Dspring-boot.run.profiles=local to skip Snowflake entirely.
snowflake:
  account: ${SNOWFLAKE_ACCOUNT:}
  user: ${SNOWFLAKE_USER:}
  password: ${SNOWFLAKE_PASSWORD:}
  warehouse: ${SNOWFLAKE_WAREHOUSE:}
  database: ${SNOWFLAKE_DATABASE:}
  schema: ${SNOWFLAKE_SCHEMA:}
  role: ${SNOWFLAKE_ROLE:}
  model: ${CORTEX_MODEL:claude-sonnet-5}

# In-app Help panel (POST /api/self-report) files GitHub issues in this repo.
# No token: the app still starts and the endpoint answers 503 not_configured.
# The token needs issues: write, plus contents: write for attachments on the branch below.
# Two instances run on the api VM (DIND#106), so the instance-shaped settings are
# environment, not constants: the sign-in cookie's name in particular, because two
# instances on one host sharing it would sign each other's users out.
contextbuilder:
  auth:
    # Must differ per instance; the default is the original deployment's.
    cookie-name: ${AUTH_COOKIE_NAME:cb_signin}
  self-report:
    github:
      token: ${GITHUB_SELF_REPORT_TOKEN:}
      api-base: https://api.github.com
      web-base: https://github.com
      repo-owner: jgperrin
      repo-name: ai.jgp.snowflakecontextbuilder
      branch: used-for-self-reports-do-not-delete
      labels: self-report
    rate-limit:
      per-hour: 5

logging:
  level:
    # The driver probes cloud metadata endpoints (EC2, GCP, Azure) at startup and logs each miss as ERROR.
    net.snowflake.client.internal.jdbc.RestRequest: OFF
    # ODCS uses $defs entries the validator does not know as keywords; it warns once per entry at startup.
    com.networknt.schema.keyword.UnknownKeywordFactory: ERROR

management:
  endpoints:
    web:
      exposure:
        # Health only. nginx proxies /contextbuilder/api/ and nothing else, so actuator
        # stays reachable on the loopback port alone and is never public.
        include: health
  health:
    db:
      # The DataSource check reports the whole app DOWN whenever Snowflake is unreachable.
      # The app is built to start anyway and fail per request, so health must describe the
      # process and not Snowflake - otherwise a Snowflake blip looks like an app outage.
      enabled: false
